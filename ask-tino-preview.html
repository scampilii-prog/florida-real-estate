:root{font-family:Manrope,system-ui,sans-serif;color:#173246;background:#f5f7f8}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1080px;margin:8vh auto;padding:24px}.brand{font-size:30px;letter-spacing:-1px}.brand b{color:#ba914c}.lead{max-width:650px;line-height:1.7;color:#536576}.demo{display:flex;gap:14px;align-items:center;margin-top:24px}button{font:inherit;cursor:pointer}.open{border:0;border-radius:30px;background:#173246;color:white;padding:15px 25px}.chat{position:fixed;right:22px;bottom:22px;width:min(390px,calc(100vw - 30px));height:min(600px,calc(100dvh - 36px));background:#fff;border-radius:18px;box-shadow:0 15px 65px #122c4430;display:none;flex-direction:column;overflow:hidden;z-index:5}.chat.active{display:flex}.head{background:#173246;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.head strong{font-size:18px}.head small{display:block;color:#e5d1a7;margin-top:4px}.close{background:transparent;border:0;color:white;font-size:25px}.messages{flex:1;overflow:auto;padding:18px;background:#f8fafb;display:flex;flex-direction:column;gap:12px}.bubble{max-width:92%;padding:12px 15px;border-radius:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.bot{align-self:flex-start;background:#fff;border:1px solid #e5ebef}.user{align-self:flex-end;background:#173246;color:white}.composer{display:flex;padding:12px;gap:8px;border-top:1px solid #e7ecef}textarea{resize:none;flex:1;min-width:0;min-height:43px;max-height:110px;padding:11px;border:1px solid #d9e2e7;border-radius:10px;font:inherit;font-size:14px}.send{background:#b68a44;color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:700}.send:disabled{opacity:.5}.note{font-size:11px;color:#6d7983;padding:0 14px 12px;text-align:center}.lang{border:1px solid #ddd;background:#fff;border-radius:8px;padding:7px}.fab{position:fixed;right:24px;bottom:24px;border:0;background:#173246;color:white;border-radius:40px;padding:16px 22px;box-shadow:0 8px 28px #17324640}@media(max-width:480px){.shell{margin:28px auto}.chat{right:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100dvh - 16px)}}
</style></head><body><main class="shell"><div class="brand">Florida <b>Costiera</b></div><h1>Ask Tino — preview</h1><p class="lead">A conversational real estate assistant for Florida's Gulf Coast. This isolated preview does not modify the public website.</p><button class="open" id="launch">Open Ask Tino</button></main><button class="fab" id="fab">Ask Tino · Chat</button><section class="chat" id="chat" role="dialog" aria-label="Ask Tino" aria-modal="false"><header class="head"><div><strong>Ask Tino</strong><small>Florida Costiera · Virtual assistant</small></div><div><select id="language" class="lang" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="it">IT</option></select><button class="close" id="close" aria-label="Close">×</button></div></header><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="form"><textarea id="question" maxlength="1000" aria-label="Your question" rows="2" required></textarea><button class="send" id="send">Send</button></form><div class="note">General information only · Confirm property-specific details with a licensed professional.</div></section>
<script>
(()=>{'use strict';const API='https://ask-tino-ai.scampilii.workers.dev/';const $=id=>document.getElementById(id);const greetings={en:['Hello! I’m Ask Tino. How can I help with Florida Gulf Coast real estate?','Ask about buying or selling…','Send'],es:['¡Hola! Soy Ask Tino. ¿Cómo puedo ayudarte con bienes raíces en la costa del Golfo de Florida?','Pregunta sobre comprar o vender…','Enviar'],it:['Ciao! Sono Ask Tino. Come posso aiutarti con gli immobili sulla costa del Golfo della Florida?','Chiedi informazioni su acquisto o vendita…','Invia']};let busy=false;function add(s,kind){const el=document.createElement('div');el.className='bubble '+kind;el.textContent=s;$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight;return el}function welcome(){const l=$('language').value;$('messages').replaceChildren();add(greetings[l][0],'bot');$('question').placeholder=greetings[l][1];$('send').textContent=greetings[l][2]}function show(){ $('chat').classList.add('active');$('fab').hidden=true;$('question').focus()}function hide(){$('chat').classList.remove('active');$('fab').hidden=false}$('launch').onclick=show;$('fab').onclick=show;$('close').onclick=hide;$('language').onchange=welcome;$('question').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const q=$('question').value.trim();if(!q)return;add(q,'user');$('question').value='';busy=true;$('send').disabled=true;const placeholder=add('…','bot');try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const answer=typeof data.reply==='string'?data.reply.trim():'';if(!answer)throw Error('Empty reply');placeholder.textContent=answer}catch(err){placeholder.textContent={en:'The assistant is temporarily unavailable. Please try again.',es:'El asistente no está disponible </script></body></html>
