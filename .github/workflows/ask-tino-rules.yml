name: Ask Tino rules
on:
  push:
    branches: [main]
    paths:
      - 'assets/ask-tino-*.js'
      - 'assets/inquiry-form.js'
      - 'assets/language-dropdown.js'
      - 'privacy.html'
      - 'scripts/check-inquiry.mjs'
      - 'scripts/check-privacy-notices.mjs'
      - 'functions/api/ask-tino*.js'
      - 'scripts/check-ask-tino*.mjs'
      - '.github/workflows/ask-tino-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-ask-tino-clean.mjs
      - run: node scripts/check-ask-tino-policy.mjs
      - run: node scripts/check-ask-tino-research.mjs
      - run: node scripts/check-ask-tino-consolidated.mjs
      - run: node scripts/check-inquiry.mjs
      - run: node scripts/check-privacy-notices.mjs
      - run: node scripts/check-ask-tino-conversations.mjs
      - run: node scripts/check-ask-tino-owner-questions.mjs
      - run: node scripts/check-ask-tino-owner-round2.mjs
      - run: node scripts/check-ask-tino-owner-round3.mjs
      - run: node scripts/check-ask-tino-owner-round4.mjs
      - run: node scripts/check-ask-tino-owner-round5.mjs
      - run: node scripts/check-ask-tino-owner-round6.mjs
      - run: node scripts/check-ask-tino-building-documents.mjs
      - run: node scripts/check-ask-tino-florida-laws.mjs
      - run: node scripts/check-ask-tino-property-diligence.mjs
      - run: node scripts/check-ask-tino-grounded.mjs
      - run: node scripts/check-ask-tino-grounded-live.mjs
      - run: node scripts/check-ask-tino-bank-group2.mjs
      - run: node scripts/check-ask-tino-bank-group3.mjs
      - run: node scripts/check-ask-tino-bank-group4.mjs
      - run: node scripts/check-ask-tino-bank-group5.mjs
      - run: node scripts/check-ask-tino-bank-group6.mjs
      - run: node scripts/check-ask-tino-bank-group7.mjs
      - run: node scripts/check-ask-tino-bank-group8.mjs
      - run: node scripts/check-ask-tino-bank-group9.mjs
      - run: node scripts/check-ask-tino-bank-group10.mjs
      - run: node scripts/check-ask-tino-adversarial.mjs
      - run: node scripts/check-ask-tino-open-house.mjs
