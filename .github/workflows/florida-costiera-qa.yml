name: Florida Costiera structural QA
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/check-website14.mjs'
      - '.github/workflows/florida-costiera-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website structure, links, anchors, and Ask Tino wiring
        run: node scripts/check-website14.mjs
